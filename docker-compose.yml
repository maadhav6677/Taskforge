services:
  redis:
    image: redis:7.2-alpine
    container_name: taskforge-redis
    command: redis-server --appendonly yes --save 60 1 --maxmemory-policy noeviction
    ports:
      - '${TASKFORGE_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:18-alpine
    container_name: taskforge-postgres
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - '${TASKFORGE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskforge -d taskforge']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    container_name: taskforge-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    volumes:
      - task-uploads:/app/storage/tasks
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:4000/api/v1/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    container_name: taskforge-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge
      REDIS_URL: redis://redis:6379
    volumes:
      - task-uploads:/app/storage/tasks

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: taskforge-web
    depends_on:
      - api
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  postgres-data-v18:
  redis-data:
  task-uploads:
